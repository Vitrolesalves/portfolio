<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#ffffff;overflow:hidden;height:100%}
  #info{position:fixed;top:10px;left:10px;z-index:10;background:#fff;padding:6px 12px;border-radius:8px;font:12px sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.12)}
</style>
</head>
<body>
<div id="info">carregando...</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const info = document.getElementById('info');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.1, 1.5, 2.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(3, 5, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -3; key.shadow.camera.right = 3;
key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0xdbe6ff, 0.55);
fill.position.set(-3, 2, -2);
scene.add(fill);

const rim = new THREE.PointLight(0xff385c, 8, 9, 2);
rim.position.set(-1.5, 1.0, -1.7);
scene.add(rim);

const rim2 = new THREE.PointLight(0xff385c, 3, 7, 2);
rim2.position.set(1.6, 0.4, -1.3);
scene.add(rim2);

const amb = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(amb);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const params = new URLSearchParams(location.search);
const modelFile = params.get('model') || 'network-sphere.glb';

loader.load('compressed/' + modelFile, (gltf) => {
  const obj = gltf.scene;
  obj.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = false; } });
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 1.6 / maxDim;
  obj.scale.setScalar(scale);
  obj.position.x -= center.x * scale;
  obj.position.z -= center.z * scale;
  obj.position.y -= box.min.y * scale;
  scene.add(obj);
  info.textContent = modelFile + ' OK';
  window.__loaded = true;
}, undefined, (err) => {
  info.textContent = 'ERRO: ' + err.message;
  window.__error = String(err.message || err);
  console.error(err);
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
