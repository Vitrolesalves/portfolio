# ============================================================
#  Nginx — Portfólio Daniel Augusto (site estático)
#  Substitua SEU_DOMINIO pelo domínio real antes de aplicar.
#  Caminho do site: /var/www/portfolio  (o repositório clonado)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO www.SEU_DOMINIO;

    root /var/www/portfolio;
    index index.html;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- headers de segurança básicos ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- cache dos assets ----
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /assets/img/favicon.svg { expires 30d; access_log off; }

    # ---- SPA-ish fallback (é uma página só) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Depois de subir o site no HTTP, gere o certificado com:
#   sudo certbot --nginx -d SEU_DOMINIO -d www.SEU_DOMINIO
# O certbot injeta o bloco 443 automaticamente e passa o 80 para redirect.
